<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINE 對話報告</title>
<style>
  :root {
    --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e4e2da; --accent:#06a05a; --warn:#b45309;
    --t1:#ffc9d4; --t2:#ffd3bd; --t3:#c3f0df; --t4:#f8ebb0; --t5:#d9cffa; --t6:#f0e6dc; --tfg:#2b2118; --track:rgba(0,0,0,.12);
    --bubble:#fff; --mine:#bdeec6; --mine-fg:#14301c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#16171a; --fg:#ececea; --muted:#9a9a94; --card:#1f2024; --line:#33343a; --accent:#3ad08a; --warn:#f0a35e;
      --t1:#4b2a35; --t2:#4a3226; --t3:#1f4137; --t4:#463f1c; --t5:#37315a; --t6:#2c2823; --tfg:#f3ebe4; --track:rgba(255,255,255,.14);
      --bubble:#34353b; --mine:#1f5a38; --mine-fg:#e8f7ec;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.75 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  h2 { font-size:1.2rem; margin:32px 0 10px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:12px 0; }
  .tint { border:0; color:var(--tfg); }
  .tint h3 { margin:0 0 10px; font-size:.95rem; font-weight:600; opacity:.85; }
  .t1{background:var(--t1)} .t2{background:var(--t2)} .t3{background:var(--t3)} .t4{background:var(--t4)} .t5{background:var(--t5)} .t6{background:var(--t6)}
  .cal { background:#141830; color:#f5e6b8; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:12px 0 4px; }
  input[type=text], input[type=password], input[type=number], select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .row { grid-template-columns:1fr; } }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:400; }
  .note { font-size:.85rem; color:var(--muted); }
  .warn { color:var(--warn); }
  #log { white-space:pre-wrap; font-size:.9rem; color:var(--muted); margin-top:10px; }
  .num { font-size:2.2rem; font-weight:800; line-height:1.15; }
  .unit { font-size:.9rem; opacity:.7; margin-left:6px; font-weight:400; }
  .rb { display:grid; grid-template-columns:minmax(90px,150px) 1fr auto; gap:10px; align-items:center; margin:6px 0; font-size:.92rem; }
  .rb .rr { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; min-width:64px; }
  .bar { height:10px; border-radius:99px; background:var(--track); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:99px; }
  .donutwrap { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .donut { width:110px; height:110px; border-radius:50%; flex:none; -webkit-mask:radial-gradient(circle 33px,transparent 98%,#000 100%); mask:radial-gradient(circle 33px,transparent 98%,#000 100%); }
  .legend { flex:1; min-width:180px; font-size:.92rem; }
  .legend div { display:flex; justify-content:space-between; gap:8px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
  .calgrid { display:grid; grid-template-columns:52px repeat(31,1fr); gap:2px; font-size:.7rem; align-items:center; }
  .calgrid .c { aspect-ratio:1; border-radius:3px; min-width:0; }
  .hours { display:flex; align-items:flex-end; gap:3px; height:90px; }
  .hours i { flex:1; border-radius:3px 3px 0 0; background:#c9b57a; min-height:2px; }
  .hours i.night { background:#5a4500; }
  .hlab { display:flex; justify-content:space-between; font-size:.72rem; opacity:.7; margin-top:4px; }
  .msgs .mb { background:var(--bubble); color:var(--fg); border-radius:14px; padding:6px 12px; margin:6px 0; max-width:92%; width:fit-content; white-space:pre-wrap; word-break:break-word; }
  .mb small { display:block; font-size:.75rem; color:var(--muted); }
  .chips span { display:inline-block; margin:3px 8px 3px 0; }
  .chips b { font-size:1.15rem; }
  .emo { font-size:1.9rem; letter-spacing:.35rem; }
  /* 報告 */
  .headline { font-size:1.65rem; line-height:1.4; margin:8px 0 14px; }
  .persona { display:flex; gap:12px; align-items:center; }
  .persona .av { width:44px; height:44px; border-radius:50%; background:var(--accent); display:grid; place-items:center; font-size:1.4rem; flex:none; }
  .rpt p { margin:14px 0; }
  .qrow { margin:12px 0; }
  .qrow small { display:block; color:var(--muted); font-size:.78rem; margin:0 0 2px 4px; }
  .qb { background:var(--mine); color:var(--mine-fg); display:inline-block; max-width:92%; padding:8px 14px; border-radius:16px 16px 16px 4px; white-space:pre-wrap; word-break:break-word; }
  .qb::after { content:" ✓✓"; font-size:.7rem; color:#2e90e8; margin-left:6px; }
  .pcard { margin:10px 0; }
  .pcard .t { font-weight:700; }
</style>
</head>
<body>
<main>
  <h1>LINE 對話報告</h1>
  <p class="sub">上傳 LINE 匯出的 .txt,先看統計,再讓 Claude 讀完寫成一篇有梗的報告。</p>

  <section class="card" id="setup">
    <label for="file">1. LINE 對話檔 (.txt)</label>
    <input id="file" type="file" accept=".txt,text/plain">
    <p class="note">LINE 聊天室右上角 ≡ → 其他設定 → 傳送聊天記錄 → 以文字檔傳送。</p>

    <div id="members" hidden>
      <label>2. 整理名字 (把暱稱和 emoji 換成簡單的名字;兩格填一樣的名字就會合併成同一人)</label>
      <div id="mlist"></div>
    </div>

    <div class="row">
      <div>
        <label for="kind">對話類型</label>
        <select id="kind">
          <option>朋友群組</option><option>好友兩人</option><option>情侶/曖昧</option>
          <option>家族群組</option><option>公司/社團群組</option>
        </select>
      </div>
      <div>
        <label for="tone">語氣</label>
        <select id="tone">
          <option value="毒舌">毒舌 (損但有愛)</option>
          <option value="中立">中立觀察</option>
          <option value="溫柔">溫柔鼓勵</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="lang">報告語言</label>
        <select id="lang">
          <option value="zh">繁體中文 (台灣)</option><option value="en">English</option>
          <option value="ja">日本語</option><option value="ko">한국어</option>
        </select>
      </div>
      <div>
        <label for="model">模型</label>
        <select id="model">
          <option value="claude-opus-5-5">Claude Opus 5.5 (品質最好)</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (較便宜)</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5 (最便宜)</option>
        </select>
      </div>
    </div>

    <label for="limit">報告只讀最近 N 則 (統計仍用全部;0 = 全部)</label>
    <input id="limit" type="number" min="0" value="3000">

    <label for="key">Anthropic API Key</label>
    <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
    <label class="note"><input id="remember" type="checkbox"> 記在這個瀏覽器 (localStorage)</label>
    <p class="note warn">Key 只存在你的瀏覽器,請求直接送到 api.anthropic.com。請用自己的 key,不要把含 key 的頁面公開。對話內容會送給 Anthropic 處理。</p>

    <p><button id="go" disabled>分析</button></p>
    <div id="log"></div>
  </section>

  <div id="story"></div>
  <div id="report"></div>
</main>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.14.0/+esm";

// <parser>
const KIND_PATTERNS = [
  [/^\[?(照片|Photo)\]?$/i, "photo"],
  [/^\[?(貼圖|Sticker)\]?$/i, "sticker"],
  [/^\[?(語音訊息|Voice message)\]?$/i, "voice"],
  [/^\[?(影片|Video)\]?$/i, "video"],
  [/^\[?(檔案|File)\]?$/i, "file"],
  [/^\[?(位置資訊|Location)\]?$/i, "location"],
  [/^(已收回訊息|.*已收回訊息|.*unsent a message.*)$/i, "unsent"],
  [/^☎/, "call"],
];

function classify(text) {
  const t = text.trim();
  for (const [re, kind] of KIND_PATTERNS) if (re.test(t)) return kind;
  return "text";
}

function parseLine(raw) {
  // 移除 LINE 匯出夾帶的雙向文字隔離字元 (U+2066-2069)
  const lines = raw.replace(/\r/g, "").replace(/[⁦-⁩]/g, "").split("\n");
  const dateRe = /^(\d{4})[./-](\d{1,2})[./-](\d{1,2})(?!\d)/;
  const timeRe = /^(上午|下午|AM|PM)?\s*(\d{1,2}):(\d{2})$/i;
  const msgs = [];
  let ymd = null, cur = null;

  for (const line of lines) {
    const parts = line.split("\t");
    const tm = parts.length >= 2 ? parts[0].match(timeRe) : null;
    if (tm && ymd) {
      let h = +tm[2];
      const m = +tm[3];
      const ap = (tm[1] || "").toUpperCase();
      if (ap === "下午" || ap === "PM") { if (h < 12) h += 12; }
      else if (ap === "上午" || ap === "AM") { if (h === 12) h = 0; }
      if (parts.length >= 3 && parts[1].trim() !== "") {
        cur = {
          ts: new Date(ymd[0], ymd[1] - 1, ymd[2], h, m).getTime(),
          name: parts[1],
          text: parts.slice(2).join("\t"),
        };
        msgs.push(cur);
      } else {
        cur = null; // 系統訊息 (加入/退出群組等,名字欄為空或只有兩欄)
      }
      continue;
    }
    if (!line.includes("\t")) {
      const dm = line.trim().match(dateRe);
      if (dm && line.trim().length < 30) { ymd = [+dm[1], +dm[2], +dm[3]]; cur = null; continue; }
    }
    if (cur && line.length) cur.text += "\n" + line; // 多行訊息的後續行
  }

  for (const m of msgs) {
    if (m.text.includes("\n") && m.text.startsWith('"') && m.text.endsWith('"')) {
      m.text = m.text.slice(1, -1);
    }
    m.kind = classify(m.text);
  }
  return msgs;
}

function groupTitle(raw) {
  const m = raw.match(/^\s*\[LINE\]\s*(.+?)的聊天記錄/m);
  return m ? m[1].replace(/^與/, "") : "";
}

// 預設顯示名:去掉 emoji 與裝飾符號;清完是空的就保留原名
function cleanName(n) {
  const c = n.replace(/\p{Extended_Pictographic}|\p{So}|\p{Script=Georgian}|[️‍]/gu, "").replace(/\s+/g, " ").trim();
  return c || n.trim();
}
function applyNames(msgs, map) {
  return msgs.map((m) => ({ ...m, name: map.get(m.name) ?? m.name }));
}

const pad = (n) => String(n).padStart(2, "0");
const fmtDate = (ts) => { const d = new Date(ts); return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`; };
const fmtTime = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayNum = (ts) => { const d = new Date(ts); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
const median = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
const EMOJI_RE = /\p{Extended_Pictographic}/gu;
const LAUGH = ["😂", "🤣", "😆", "😅", "😹", "😁", "😄", "🤭"];

// 給 prompt 用的每人數字 (範圍 = 實際送給模型讀的訊息)
function computeStats(msgs) {
  const GAP = 6 * 3600e3;
  const people = new Map();
  const get = (n) => {
    if (!people.has(n)) people.set(n, { name: n, messages: 0, textChars: 0, photos: 0, stickers: 0, voice: 0, unsent: 0,
      lateNight: 0, openers: 0, questions: 0, laughs: 0, emojiTokens: 0, replies: [], emojis: new Map(), hours: Array(24).fill(0) });
    return people.get(n);
  };
  const perDay = new Map();
  let prev = null, longestSilence = { ms: 0, from: 0 };

  for (const m of msgs) {
    const p = get(m.name);
    p.messages++;
    const h = new Date(m.ts).getHours();
    p.hours[h]++;
    if (h < 5) p.lateNight++;
    if (m.kind === "photo") p.photos++;
    else if (m.kind === "sticker") p.stickers++;
    else if (m.kind === "voice") p.voice++;
    else if (m.kind === "unsent") p.unsent++;
    else if (m.kind === "text") {
      p.textChars += m.text.length;
      if (/[?？]/.test(m.text)) p.questions++;
      if (/哈|XD|笑死|www|lol/i.test(m.text)) p.laughs++;
      p.emojiTokens += (m.text.match(/\(emoji\)/g) || []).length; // LINE 自家表情符號匯出時會變成 "(emoji)"
      for (const e of m.text.match(EMOJI_RE) || []) p.emojis.set(e, (p.emojis.get(e) || 0) + 1);
    }
    const day = fmtDate(m.ts);
    perDay.set(day, (perDay.get(day) || 0) + 1);
    if (prev) {
      const gap = m.ts - prev.ts;
      if (gap > longestSilence.ms) longestSilence = { ms: gap, from: prev.ts };
      if (gap > GAP) p.openers++;
      else if (prev.name !== m.name) p.replies.push(gap / 60e3);
    } else p.openers++;
    prev = m;
  }

  const list = [...people.values()].sort((a, b) => b.messages - a.messages).map((p) => ({
    name: p.name, messages: p.messages, pct: msgs.length ? Math.round((p.messages / msgs.length) * 100) : 0,
    avgChars: p.messages ? +(p.textChars / p.messages).toFixed(1) : 0,
    photos: p.photos, stickers: p.stickers, voice: p.voice, unsent: p.unsent,
    emojiCount: p.emojiTokens, lateNightMessages: p.lateNight, conversationOpeners: p.openers, questions: p.questions, laughs: p.laughs,
    medianReplyMinutes: p.replies.length ? +median(p.replies).toFixed(1) : null,
    peakHour: p.hours.indexOf(Math.max(...p.hours)),
    topEmojis: [...p.emojis.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([e, c]) => `${e}×${c}`),
  }));
  const busiest = [...perDay.entries()].sort((a, b) => b[1] - a[1])[0];
  return {
    totalMessages: msgs.length,
    from: msgs.length ? fmtDate(msgs[0].ts) : null,
    to: msgs.length ? fmtDate(msgs[msgs.length - 1].ts) : null,
    activeDays: perDay.size,
    busiestDay: busiest ? { date: busiest[0], messages: busiest[1] } : null,
    longestSilenceDays: +(longestSilence.ms / 86400e3).toFixed(1),
    people: list,
  };
}

// 給畫面用的「故事式」統計 (全部訊息,純程式計算)
function computeStory(msgs) {
  const people = new Map();
  const P = (n) => {
    let p = people.get(n);
    if (!p) people.set(n, p = { name: n, messages: 0, stickers: 0, unsent: 0, openers: 0, longest: null, laugh: new Map() });
    return p;
  };
  const calendar = new Map(), hours = Array(24).fill(0), emojiAll = new Map(), days = [];
  let lastKey = null;

  for (const m of msgs) {
    const p = P(m.name); p.messages++;
    const key = fmtDate(m.ts);
    calendar.set(key, (calendar.get(key) || 0) + 1);
    if (key !== lastKey) { p.openers++; lastKey = key; days.push(dayNum(m.ts)); }
    hours[new Date(m.ts).getHours()]++;
    if (m.kind === "sticker") p.stickers++;
    else if (m.kind === "unsent") p.unsent++;
    else if (m.kind === "text") {
      const len = [...m.text].length;
      if (!p.longest || len > p.longest.len) p.longest = { len, ts: m.ts, text: m.text };
      for (const e of m.text.match(EMOJI_RE) || []) {
        emojiAll.set(e, (emojiAll.get(e) || 0) + 1);
        if (LAUGH.includes(e)) p.laugh.set(e, (p.laugh.get(e) || 0) + 1);
      }
    }
  }

  const total = msgs.length;
  const sorted = [...people.values()].sort((a, b) => b.messages - a.messages);
  const top = sorted.slice(0, 5);
  const pct = (n, d) => (d ? Math.round((n / d) * 100) : 0);

  const share = top.map((p) => ({ name: p.name, count: p.messages, pct: pct(p.messages, total) }));
  const otherCount = total - top.reduce((s, p) => s + p.messages, 0);
  const openers = top.map((p) => ({ name: p.name, pct: pct(p.openers, days.length) }));
  const totalStickers = sorted.reduce((s, p) => s + p.stickers, 0);
  const stickers = { total: totalStickers,
    list: [...sorted].sort((a, b) => b.stickers - a.stickers).slice(0, 5).filter((p) => p.stickers > 0)
      .map((p) => ({ name: p.name, pct: pct(p.stickers, totalStickers) })) };
  const unsent = [...sorted].sort((a, b) => b.unsent - a.unsent).filter((p) => p.unsent > 0).slice(0, 6)
    .map((p) => ({ name: p.name, count: p.unsent }));

  let streak = 0, bestStreak = 0, bestGap = 0;
  for (let i = 0; i < days.length; i++) {
    streak = i && days[i] - days[i - 1] === 1 ? streak + 1 : 1;
    bestStreak = Math.max(bestStreak, streak);
    if (i) bestGap = Math.max(bestGap, days[i] - days[i - 1] - 1);
  }
  const busiest = [...calendar.entries()].sort((a, b) => b[1] - a[1])[0];
  const night = hours.slice(22).reduce((a, b) => a + b, 0) + hours.slice(0, 5).reduce((a, b) => a + b, 0);

  const longest = [...sorted].filter((p) => p.longest).sort((a, b) => b.longest.len - a.longest.len).slice(0, 2)
    .map((p) => ({ name: p.name, ...p.longest, date: fmtDate(p.longest.ts) }));

  const edge = (arr) => arr.filter((m) => m.kind === "text").slice(0, 5);
  const firstKey = total ? fmtDate(msgs[0].ts) : null, lastK = total ? fmtDate(msgs[total - 1].ts) : null;
  const firstDay = { date: firstKey, msgs: edge(msgs.filter((m) => fmtDate(m.ts) === firstKey).slice(0, 40)) };
  const lastDay = { date: lastK, msgs: edge(msgs.filter((m) => fmtDate(m.ts) === lastK).reverse().slice(0, 40)).reverse() };

  // 笑法:最常用的笑臉 emoji、每人用量、單則最高連打
  const laughTotals = new Map();
  for (const p of sorted) for (const [e, c] of p.laugh) laughTotals.set(e, (laughTotals.get(e) || 0) + c);
  const best = [...laughTotals.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || null;
  let laughRecord = null;
  if (best) {
    const re = new RegExp(`(?:${best})+`, "gu");
    for (const m of msgs) {
      if (m.kind !== "text" || !m.text.includes(best)) continue;
      for (const mt of m.text.matchAll(re)) {
        const run = [...mt[0]].length;
        if (!laughRecord || run > laughRecord.run) laughRecord = { run, name: m.name };
      }
    }
  }
  const laugh = best ? { emoji: best, record: laughRecord,
    list: [...sorted].map((p) => ({ name: p.name, count: p.laugh.get(best) || 0 })).filter((x) => x.count > 0)
      .sort((a, b) => b.count - a.count).slice(0, 4) } : null;

  return {
    total, share, otherPct: pct(otherCount, total), openers, stickers, unsent,
    calendar, busiest: busiest ? { date: busiest[0], count: busiest[1] } : null,
    streakDays: bestStreak, longestGapDays: bestGap, hours, peakHour: hours.indexOf(Math.max(...hours)),
    nightPct: pct(night, total), longest, firstDay, lastDay, laugh,
    topEmojis: [...emojiAll.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([e]) => e),
    order: sorted.map((p) => p.name),
  };
}

const STOP = new Set(("什麼 這個 那個 可以 不是 沒有 我們 你們 他們 就是 然後 所以 因為 但是 如果 還是 已經 真的 一個 自己 知道 覺得 現在 今天 明天 昨天 " +

// 最常用字詞與口頭禪 (口頭禪 = 短訊息裡、跨很多天都會出現的詞;啟發式,不是語言學上的定義)
function wordStats(msgs, names) {
  if (typeof Intl === "undefined" || !Intl.Segmenter) return { topWords: [], catchphrases: [] };
  const seg = new Intl.Segmenter("zh-TW", { granularity: "word" });
  const skip = new Set();
  for (const n of names) { skip.add(n.toLowerCase()); for (const p of n.toLowerCase().split(/[^\p{L}\p{N}]+/u)) if (p) skip.add(p); }
  const stat = new Map(); const days = new Set();
  for (const m of msgs) {
    if (m.kind !== "text") continue;
    const day = fmtDate(m.ts); days.add(day);
    const t = m.text.replace(/https?:\/\/\S+/g, " ").replace(/\(emoji\)/g, " ").replace(/\[[^\]]*\]/g, " ");
    const short = t.length <= 10;
    for (const s of seg.segment(t)) {
      if (!s.isWordLike) continue;
      const w = s.segment.toLowerCase();
      if (w.length < 2 || /^\d+$/.test(w) || STOP.has(w) || skip.has(w)) continue;
      let e = stat.get(w);
      if (!e) stat.set(w, e = { n: 0, short: 0, dayCount: 0, last: "" });
      e.n++; if (short) e.short++;
      if (e.last !== day) { e.dayCount++; e.last = day; }
    }
  }
  const nDays = Math.max(1, days.size);
  const minN = Math.max(3, Math.floor(msgs.length / 3000));
  const all = [...stat.entries()].map(([word, e]) => ({ word, count: e.n, short: e.short / e.n, spread: e.dayCount / nDays }));
  const catchphrases = all.filter((x) => x.count >= minN && x.short >= 0.6 && x.spread >= 0.1)
    .sort((a, b) => b.count * b.spread * b.short - a.count * a.spread * a.short).slice(0, 4);
  const cp = new Set(catchphrases.map((x) => x.word));
  const topWords = all.filter((x) => !cp.has(x.word)).sort((a, b) => b.count - a.count).slice(0, 5);
  return { topWords, catchphrases };
}

function toTranscript(msgs) {
  const out = []; let day = "";
  for (const m of msgs) {
    const d = fmtDate(m.ts);
    if (d !== day) { out.push(`## ${d}`); day = d; }
    const body = m.kind === "text" ? m.text.replace(/\n/g, " ⏎ ") : `[${m.kind}]`;
    out.push(`${fmtTime(m.ts)} ${m.name}: ${body}`);
  }
  return out.join("\n");
}

function chunkTranscript(text, maxChars) {
  const chunks = []; let cur = [], len = 0;
  for (const line of text.split("\n")) {
    if (len + line.length > maxChars && cur.length) { chunks.push(cur.join("\n")); cur = []; len = 0; }
    cur.push(line); len += line.length + 1;
  }
  if (cur.length) chunks.push(cur.join("\n"));
  return chunks;
}

const squash = (s) => s.replace(/\s+/g, "");
// 只保留能在原文逐字找到的引用,擋掉模型編造的名場面
function verifyBlocks(blocks, msgs) {
  const hay = squash(msgs.filter((m) => m.kind === "text").map((m) => m.text).join("\n"));
  const kept = []; let dropped = 0;
  for (const b of blocks) {
    if (b.kind !== "quote") { kept.push(b); continue; }
    const q = squash(b.text || "");
    if (q.length > 1 && hay.includes(q)) kept.push(b); else dropped++;
  }
  return { kept, dropped };
}

async function run() {

  const all = applyNames(parsed, nameMap);

  const story = computeStory(all);

  const limit = Math.max(0, parseInt($("limit").value, 10) || 0);
  const msgs = limit && all.length > limit ? all.slice(-limit) : all;
  const model = $("model").value, kind = $("kind").value, tone = $("tone").value, lang = $("lang").value;
  const stats = computeStats(msgs);

  const needDigest = transcript.length > DIRECT_LIMIT;

  const [pin, pout] = PRICE[model];
  const finalIn = needDigest ? 40000 : transcript.length; // 中文約 1 字 ≈ 1 token (保守估計)
  const est = ((needDigest ? transcript.length * PRICE[DIGEST_MODEL][0] : 0) + finalIn * pin + 10000 * pout) / 1e6;
  if (!confirm(`報告會讀最近 ${msgs.length} 則 / 約 ${transcript.length.toLocaleString()} 字。\n預估費用約 US$${est.toFixed(2)} (粗估)。\n確定要送出嗎?對話內容會傳給 Anthropic。`)) {
    log("已取消 (統計卡片是在本機算的,沒有送出任何資料)。"); return;
  }

  $("go").disabled = true;
  const client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true });

  try {
    let material;
    if (needDigest) {
      const chunks = chunkTranscript(transcript, CHUNK_CHARS);
      const digests = new Array(chunks.length);
      let done = 0, next = 0;
      const worker = async () => {
        while (next < chunks.length) {
          const i = next++;
          const r = await client.messages.create({
            model: DIGEST_MODEL, max_tokens: 4000, output_config: { effort: "low" },
            system: "你是聊天記錄整理員,用台灣繁體中文。只根據提供內容整理,不要編造。人名照原文寫。",
            messages: [{ role: "user", content:
`下面是 LINE 對話的第 ${i + 1}/${chunks.length} 段。請條列整理(總共 1500 字內):
1. 發生的重要事件(依時間,附日期)
2. 每位發言者在這段的語氣、行為特色
3. 重複出現的內梗、口頭禪(附原文)
4. 情緒轉折、衝突或有趣的互動
5. 5~8 句精彩原句(必須逐字照抄,標註說話者與日期)

<chat>
${chunks[i]}
</chat>` }],
          });
          digests[i] = r.content.filter((b) => b.type === "text").map((b) => b.text).join("");
          log(`整理對話中… ${++done}/${chunks.length} 段`);
        }
      };
      log(`整理對話中… 0/${chunks.length} 段`);
      await Promise.all([worker(), worker(), worker()]);
      material = digests.map((d, i) => `### 第 ${i + 1} 段摘要\n${d}`).join("\n\n");
    } else material = transcript;

    // 摘要模式下,最後兩天的原文另外附上,讓開頭鉤子有最新鮮的素材
    const tail = needDigest ? `\n\n<recent_chat>\n${toTranscript(msgs.slice(-150))}\n</recent_chat>` : "";
    const tag = needDigest ? "digest" : "chat";

    log("寫報告中…");
    const stream = client.messages.stream({
      model, max_tokens: 32000,
      output_config: { effort: "medium", format: { type: "json_schema", schema: SCHEMA } },
      system: systemPrompt({ kind, tone, lang, title }),
      messages: [{ role: "user", content:
`請根據以下資料寫報告。

<stats>
${JSON.stringify(stats.people.slice(0, 15))}
</stats>

<overview>
${JSON.stringify({ ...stats, people: undefined, fullChatMessages: all.length, fullChatFrom: fmtDate(all[0].ts), fullChatTo: fmtDate(all[all.length - 1].ts) })}
</overview>

<${tag}>
${material}
</${tag}>${tail}` }],
    });
    let chars = 0;
    stream.on("text", (t) => { chars += t.length; log(`寫報告中… ${chars} 字`); });
    const final = await stream.finalMessage();

    if (final.stop_reason === "refusal") throw new Error("模型拒絕處理這段內容。");
    if (final.stop_reason === "max_tokens") throw new Error("報告太長被截斷,請減少分析範圍再試。");
    const report = JSON.parse(final.content.filter((b) => b.type === "text").map((b) => b.text).join(""));
    const v = verifyBlocks(report.blocks, all);
    report.blocks = v.kept;
    renderReport(report, stats, v.dropped, final.usage, msgs.length < all.length);
    log("完成。");
  } catch (e) {
    log(e instanceof Anthropic.APIError ? `API 錯誤 (${e.status}):${e.message}` : `錯誤:${e.message}`);
  } finally { $("go").disabled = false; }
}

    s.longest.map((l) => tint("t6", l.name, el("div", { class: "num" }, unit(l.len, `個字 · ${l.date}`)), el("div", { class: "msgs" }, bubble({ name: l.name, text: l.text })))),
    el("h2", {}, "一切從這裡開始"), tint("t6", s.firstDay.date, el("div", { class: "msgs" }, s.firstDay.msgs.map(bubble))),
    el("h2", {}, "到目前為止,就停在這裡"), tint("t6", s.lastDay.date, el("div", { class: "msgs" }, s.lastDay.msgs.map(bubble))));

  // 用字
  parts.push(el("h2", {}, "你們的用字"));
  if (s.laugh) parts.push(tint("t1", "你們的笑法", s.laugh.list.map((p) => rowBar(p.name, Math.round((p.count / s.laugh.list[0].count) * 100), color(p.name), `${s.laugh.emoji}×${p.count}`)),
    s.laugh.record && s.laugh.record.run > 1 ? el("p", { class: "note" }, `最高紀錄:一口氣打了 ${s.laugh.record.run} 個 ${s.laugh.emoji} · ${s.laugh.record.name}`) : null));
  if (w.catchphrases.length) parts.push(tint("t2", "口頭禪", el("div", { class: "chips" }, w.catchphrases.map((x) => el("span", {}, el("b", {}, x.word), ` ${x.count.toLocaleString()} 次`)))));
  if (w.topWords.length) parts.push(tint("t3", "最常用的字詞", w.topWords.map((x, i) => el("div", {}, el("small", { class: "note" }, `#${i + 1} `), el("b", {}, x.word), el("small", { class: "note" }, `  ${x.count.toLocaleString()} 次`)))));
  if (s.topEmojis.length) parts.push(tint("t4", "最常用的 emoji", el("div", { class: "emo" }, s.topEmojis.join(" "))));
  if (s.stickers.total) parts.push(tint("t5", "貼圖", el("div", { class: "num" }, unit(s.stickers.total.toLocaleString(), "張貼圖")), s.stickers.list.map((p) => rowBar(p.name, p.pct, color(p.name)))));

  mount($("story"), el("h1", {}, title || "對話統計"), el("p", { class: "sub" }, `${s.total.toLocaleString()} 則訊息 (以下統計全部由你的瀏覽器計算,沒有送出)`), ...parts);
}

// ---------- 報告 ----------
const rich = (text) => text.split("**").map((s, i) => (i % 2 ? el("strong", {}, s) : s));

function renderReport(r, stats, dropped, usage, windowed) {
  const root = $("report");
  mount(root,
    el("h2", {}, "報告"),
    el("h1", { class: "headline" }, r.headline),
    el("div", { class: "card persona" }, el("div", { class: "av" }, "🧐"), el("div", {}, el("strong", {}, PERSONA.name), el("div", { class: "note" }, "讀完整段對話,說出他的真心話。"))),
    windowed ? el("p", { class: "note" }, `報告只讀了最近 ${stats.totalMessages} 則 (${stats.from} ~ ${stats.to}),較早的訊息沒有納入。`) : null,
    el("div", { class: "rpt" }, r.blocks.map((b) => b.kind === "quote"
      ? el("div", { class: "qrow" }, el("small", {}, [b.speaker, b.date].filter(Boolean).join(" · ")), el("div", { class: "qb" }, b.text))
      : el("p", {}, rich(b.text)))),
    dropped ? el("p", { class: "note" }, `已過濾 ${dropped} 則無法對應原文的引用。`) : null,
    el("h2", {}, "成員檔案"),
    r.people.map((p) => {
      const s = stats.people.find((x) => x.name === p.name);
      return el("div", { class: "card pcard" }, el("div", { class: "t" }, `${p.name} · ${p.title}`), el("div", {}, p.description),
        s ? el("div", { class: "note" }, `${s.messages} 則 · 平均 ${s.avgChars} 字 · 深夜發言 ${s.lateNightMessages} · 開話題 ${s.conversationOpeners} 次`
          + (s.medianReplyMinutes != null ? ` · 回覆中位數 ${s.medianReplyMinutes} 分` : "")) : null);
    }),
    el("p", {}, r.closing),
    el("p", { class: "note" }, `本報告為 AI 依文字內容產生的娛樂用途分析,不代表事實。 (輸入 ${usage.input_tokens} / 輸出 ${usage.output_tokens} tokens)`),
    el("button", { class: "ghost", id: "dl" }, "下載 JSON"));
  $("dl").onclick = () => {
    const a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify({ report: r, stats }, null, 2)], { type: "application/json" })), download: "line-report.json" });
    a.click();
  };
  root.scrollIntoView({ behavior: "smooth" });
}
</script>
</body>
</html>
